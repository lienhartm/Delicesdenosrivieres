<!doctype html>

<html>
	<head>
		<meta charset="utf-8">

		<title>Délices de nos rivières</title>

		<link rel="stylesheet" href="style.css">

		<style>
			body	{
				text-align: center;
			}
			h1	{
				color: #141E6E;
				font-size: 60px;
				border-bottom: 2px solid #141E6E;
			}
			h1:before	{
				content: url("media/l0g0-1.png");
				position: relative;
				right: 25px;
				top: 25px;
				border-bottom: 2px solid #141E6E;
			}
			section {
				max-width: 2000px;
				position: relative;
				margin: auto;
			}
			.mySlides {
				display: none;
			}
			img {
				vertical-align: middle;
				width: 750px;
				height: 500px;
			}
			footer	{
				background-color: rgba(20,30,110,0.5);
				margin-top: 0px;
				padding: 50px;
			}
		</style>
	</head>

	<body>

		<header>
			<h1>Délices de nos rivières</h1>
		</header>

		<section>

			<figure class="mySlides">
				<img src="media/romancerhenane.jpg">
			</figure>

			<figure class="mySlides">
				<img src="media/onderhenane.jpg">
			</figure>

			<figure class="mySlides">
				<img src="media/fetevigneronne.jpg">
			</figure>

			<figure class="mySlides">
				<img src="media/midnightfox.jpg">
			</figure>

			<p># Téléchargement des flyers  d'évènement au format PDF #</p>
			<pre># Evènementielle #
			<li># Enregistrement des commandes #</li>
			<li># Newsletter de satisfaction #</li>
			</pre>

		</section>

		<footer class="center">
			<h6>LM LIENHART MICHAEL</h6>
		</footer>

	</body>

	<script>

		let slideIndex = 0;
		showSlides();

		function showSlides() {
			let i;
			let slides = document.getElementsByClassName("mySlides");
			for (i = 0; i < slides.length; i++) {
				slides[i].style.display = "none";
			}
			slideIndex++;
			if (slideIndex > slides.length) { slideIndex = 1 }
			slides[slideIndex-1].style.display = "block";
			setTimeout(showSlides, 8000);
		}

	</script>

</html>
