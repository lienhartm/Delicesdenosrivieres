    <script>
		async function init() {
		
		    // Attendre le chargement des composants Google Maps
		    await Promise.all([
		        customElements.whenDefined('gmp-map'),
		        customElements.whenDefined('gmp-advanced-marker'),
		        customElements.whenDefined('gmpx-place-picker')
		    ]);
		
		    // Récupération des composants HTML
		    const map = document.querySelector('gmp-map');
		    const marker = document.querySelector('gmp-advanced-marker');
		    const placePicker = document.querySelector('gmpx-place-picker');
		
		    // Création de la fenêtre d'information
		    const infowindow = new google.maps.InfoWindow();
		
		    // Configuration de la carte
		    map.innerMap.setOptions({
		        mapTypeControl: false
		    });
		
		    // Position initiale : Rue Mittelhardt, Balgau
		    const positionInitiale = {
		        lat: 47.927672,
		        lng: 7.536155
		    };
		
		    map.center = positionInitiale;
		    map.zoom = 18;
		
		    marker.position = positionInitiale;
		    marker.title = "Délices de nos rivières";
		
		    // Recherche d'une adresse
		    placePicker.addEventListener('gmpx-placechange', () => {
		
		        const place = placePicker.value;
		
		        if (!place.location) {
		
		            window.alert(
		                "Aucune information disponible pour : " + place.name
		            );
		
		            infowindow.close();
		            marker.position = null;
		
		            return;
		        }
		
		        // Déplacement de la carte
		        if (place.viewport) {
		
		            map.innerMap.fitBounds(place.viewport);
		
		        } else {
		
		            map.center = place.location;
		            map.zoom = 17;
		
		        }
		
		        // Déplacement du marqueur
		        marker.position = place.location;
		
		        // Informations du lieu
		        infowindow.setContent(`
		            <strong>${place.displayName}</strong><br>
		            <span>${place.formattedAddress}</span>
		        `);
		
		        // Affichage de la fenêtre
		        infowindow.open(map.innerMap, marker);
		
		    });
		
		}
		
		// Initialisation
		document.addEventListener('DOMContentLoaded', init);

	</script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.11/index.min.js">
    </script>
